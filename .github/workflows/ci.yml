name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ExcelBatchTool.sln

      - name: Build
        run: dotnet build ExcelBatchTool.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ExcelBatchTool.Core.Tests/ExcelBatchTool.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
